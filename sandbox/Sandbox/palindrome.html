<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Tests</title>
    <script src="palindrome.js" defer></script>
</head>
<body>
    <header>
        <h1>Welcome to my sandbox of JS tests. Let's see what I can learn</h1>
    </header>
    <main>
        <form id="palindrome-form">
            <h2>Input anything to test if it's a palindrome. The test is case insensitive and removes any nonalphanumeric character.</h2>
            <label for="palindrome">Enter text:</label>
            <input type="text" id="palindrome" name="palindrome" placeholder="racecar" required>
            <button type="submit">Check Palindrome</button>
        </form>
        <p id="result-message"></p>
    </main>
    

</body>
</html>
